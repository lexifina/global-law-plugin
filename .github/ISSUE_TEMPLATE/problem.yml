name: Problem with the plugin or a skill
description: An install that fails, a skill that does not fire, or an answer that ignores the record.
body:
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Claude Code
        - Cursor
        - Gemini CLI
        - Cline
        - Grok Build
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 1.1.0
  - type: textarea
    id: asked
    attributes:
      label: What you asked
      description: The question or the install command, as you typed it.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The answer or the error, and what you expected instead.
    validations:
      required: true
